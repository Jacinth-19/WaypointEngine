name: Build

# Two jobs, deliberately separate:
#   core    - headless: engine + tests, no GPU, no window. Fast and reliable.
#   desktop - the real thing: bgfx + SDL3 + shaderc, builds the player.
# If `core` is red, nothing else matters.

on:
  push:
    branches: [main, "arena/**"]
    # A documentation change cannot break a compiler; skip the matrix for it.
    paths-ignore: ["**.md", "docs/**", "LICENSE", "NOTICE"]
  pull_request:
  workflow_dispatch:

# Needed so a failing job can post its own error lines as a commit comment.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      WAYPOINT_HEADLESS_BUILD: "1"
      NO_COLOR: "1"

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # CMake with Ninja picks the first compiler on PATH. On windows-latest that
      # is clang, not MSVC, so ask for the toolchain the docs actually promise.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache dependency checkouts
        uses: actions/cache@v4
        with:
          path: .cache/waypoint-deps
          key: waypoint-deps-${{ runner.os }}-${{ hashFiles('external/dependencies.lock.json') }}
          restore-keys: waypoint-deps-${{ runner.os }}-

      - name: Fetch pinned dependencies
        run: python tools/wp.py deps fetch

      - name: Verify every pin matches the lockfile
        run: python tools/wp.py deps status

      - name: Doctor
        run: python tools/wp.py doctor

      - name: Configure, build and test (headless)
        shell: bash
        run: |
          set -o pipefail
          WAYPOINT_HEADLESS_BUILD=1 python tools/wp.py test 2>&1 | tee build.log

      # GitHub's raw job logs are only reachable as an artifact download, which is
      # useless when you are debugging from the API or a phone. On failure, turn
      # the interesting lines of build.log into check-run annotations (always
      # visible in the UI and via the REST API) plus a commit comment.
      # Nothing on a runner can open a window, but bgfx's noop backend runs the
      # same submit path - create programs, issue draw calls, present - so this is
      # the only automated evidence that a frame actually happens.
      - name: Smoke test - render one frame with the noop backend
        shell: bash
        run: |
          BIN=build/default/bin/waypoint
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          WAYPOINT_RENDERER=noop SDL_VIDEODRIVER=dummy "$BIN" samples/hello_cube --smoke-test

      - name: Report failure lines
        if: failure()
        shell: bash
        run: |
          excerpt=build-excerpt.txt
          {
            echo "### core ${{ matrix.os }} - headless build + tests"
            # The lines that mention an error, minus CMake's configure chatter.
            grep -nE "error|CMake Error|FAILED:|undefined reference|ninja: build stopped|tests failed|No such file" build.log \
              | grep -vE "^[0-9]+:-- |0 errors?|error-reporting|-Werror" | head -15 | cut -c1-800 || true
            # ...plus the block after the first FAILED:, because a tool like
            # shaderc prints its complaint underneath the command that failed
            # and the word "error" may appear nowhere in it.
            failed_at=$(grep -n "FAILED:" build.log | head -1 | cut -d: -f1)
            if [ -n "$failed_at" ]; then
              echo "--- first failing block ---"
              sed -n "${failed_at},$((failed_at + 20))p" build.log | cut -c1-800
            fi
          } > "$excerpt"
          if [ ! -s "$excerpt" ]; then
            tail -n 80 build.log >> "$excerpt"
          fi
          head -10 "$excerpt" | while IFS= read -r line; do
            safe=${line//'%'/'%25'}
            safe=${safe//$'\r'/}
            safe=${safe//$'\n'/'%0A'}
            echo "::error::${safe}"
          done
          if command -v gh >/dev/null 2>&1 && [ -n "${GH_TOKEN:-}" ]; then
            body=$(printf 'CI failure - %s - %s\n\n```\n%s\n```\n' "core ${{ matrix.os }}" "headless build + tests" "$(cat "$excerpt")")
            gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -f body="$body" || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  desktop:
    name: Desktop runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      NO_COLOR: "1"

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # CMake with Ninja picks the first compiler on PATH. On windows-latest that
      # is clang, not MSVC, so ask for the toolchain the docs actually promise.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev libwayland-dev \
            libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libvulkan-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Cache dependency checkouts
        uses: actions/cache@v4
        with:
          path: .cache/waypoint-deps
          key: waypoint-deps-desktop-${{ runner.os }}-${{ hashFiles('external/dependencies.lock.json') }}
          restore-keys: waypoint-deps-desktop-${{ runner.os }}-

      - name: Fetch pinned dependencies
        run: python tools/wp.py deps fetch

      - name: Build runtime (bgfx + SDL3 + shaderc + Jolt + Lua)
        shell: bash
        run: |
          set -o pipefail
          python tools/wp.py build 2>&1 | tee build.log

      # GitHub's raw job logs are only reachable as an artifact download, which is
      # useless when you are debugging from the API or a phone. On failure, turn
      # the interesting lines of build.log into check-run annotations (always
      # visible in the UI and via the REST API) plus a commit comment.
      # Nothing on a runner can open a window, but bgfx's noop backend runs the
      # same submit path - create programs, issue draw calls, present - so this is
      # the only automated evidence that a frame actually happens.
      - name: Smoke test - render one frame with the noop backend
        shell: bash
        run: |
          BIN=build/default/bin/waypoint
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          WAYPOINT_RENDERER=noop SDL_VIDEODRIVER=dummy "$BIN" samples/hello_cube --smoke-test

      - name: Report failure lines
        if: failure()
        shell: bash
        run: |
          excerpt=build-excerpt.txt
          {
            echo "### desktop ${{ matrix.os }} - runtime build"
            # The lines that mention an error, minus CMake's configure chatter.
            grep -nE "error|CMake Error|FAILED:|undefined reference|ninja: build stopped|tests failed|No such file" build.log \
              | grep -vE "^[0-9]+:-- |0 errors?|error-reporting|-Werror" | head -15 | cut -c1-800 || true
            # ...plus the block after the first FAILED:, because a tool like
            # shaderc prints its complaint underneath the command that failed
            # and the word "error" may appear nowhere in it.
            failed_at=$(grep -n "FAILED:" build.log | head -1 | cut -d: -f1)
            if [ -n "$failed_at" ]; then
              echo "--- first failing block ---"
              sed -n "${failed_at},$((failed_at + 20))p" build.log | cut -c1-800
            fi
          } > "$excerpt"
          if [ ! -s "$excerpt" ]; then
            tail -n 80 build.log >> "$excerpt"
          fi
          head -10 "$excerpt" | while IFS= read -r line; do
            safe=${line//'%'/'%25'}
            safe=${safe//$'\r'/}
            safe=${safe//$'\n'/'%0A'}
            echo "::error::${safe}"
          done
          if command -v gh >/dev/null 2>&1 && [ -n "${GH_TOKEN:-}" ]; then
            body=$(printf 'CI failure - %s - %s\n\n```\n%s\n```\n' "desktop ${{ matrix.os }}" "runtime build" "$(cat "$excerpt")")
            gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -f body="$body" || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.os }}
          path: |
            build/default/CMakeCache.txt
            build/default/**/*.log
          if-no-files-found: ignore
          retention-days: 7
